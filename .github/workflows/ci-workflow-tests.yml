name: CI - Workflow Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'packages/openfn/**'
      - 'projects/indicator_workflow_testing/**'
      - '.github/workflows/ci-workflow-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'packages/openfn/**'
      - 'projects/indicator_workflow_testing/**'
      - '.github/workflows/ci-workflow-tests.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["CI - Environment Setup"]
    types:
      - completed

env:
  # Docker settings
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  
  # Docker registry for caching
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
  # Test settings
  VERBOSE: false
  NODE_VERSION: 18

jobs:
  workflow-tests:
    name: OpenFN Workflow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host
            
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-tests-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-tests-
            ${{ runner.os }}-buildx-
            
      - name: Pre-pull base images
        run: |
          echo "Pre-pulling base images for tests..."
          docker pull node:18-alpine &
          docker pull alpine:latest &
          wait
          echo "Base images pre-pulled"
        
      - name: Build CLI test image with cache
        run: |
          cd projects/indicator_workflow_testing
          
          # Build CLI test image with caching
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -t openfn-cli-test \
            .
          
          echo "CLI test image built successfully"
          docker images | grep openfn-cli-test
          
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true
          
      - name: Run CLI workflow tests
        run: |
          cd projects/indicator_workflow_testing
          
          echo "Running OpenFN CLI workflow tests..."
          
          # Test 1: Basic workflow validation
          echo "=== Running workflow validation test ==="
          docker run --rm \
            -v "$(pwd)/workflows:/app/workflows:ro" \
            -v "$(pwd)/sample-data:/app/sample-data:ro" \
            openfn-cli-test \
            openfn test workflows/sftp-dhis2.js \
              --expression-path ./workflows \
              --data-path ./sample-data/sample.json \
              --no-compile
          
          # Test 2: Workflow execution with sample data
          echo -e "\n=== Running workflow execution test ==="
          docker run --rm \
            -v "$(pwd)/workflows:/app/workflows:ro" \
            -v "$(pwd)/sample-data:/app/sample-data:ro" \
            openfn-cli-test \
            openfn execute \
              --expression ./workflows/sftp-dhis2.js \
              --data ./sample-data/sample.json \
              --output-json
          
          # Test 3: Workflow configuration validation
          echo -e "\n=== Running configuration validation test ==="
          docker run --rm \
            -v "$(pwd)/workflows:/app/workflows:ro" \
            -v "$(pwd)/config:/app/config:ro" \
            openfn-cli-test \
            openfn validate ./workflows/project.yaml
          
          echo "✅ All CLI workflow tests completed successfully"
          
  integration-test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [workflow-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.workflow-tests.result }}" == "success" ]; then
            echo "✅ All CLI workflow tests passed!"
            exit 0
          else
            echo "❌ CLI workflow tests failed or were skipped"
            echo "Result: ${{ needs.workflow-tests.result }}"
            exit 1
          fi 