name: CI - CLI Workflow Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'packages/openfn/**'
      - 'projects/indicator_workflow_testing/**'
      - '.github/workflows/ci-workflow-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'packages/openfn/**'
      - 'projects/indicator_workflow_testing/**'
      - '.github/workflows/ci-workflow-tests.yml'
  workflow_dispatch:
  # Lightweight tests that don't require running services
  # For integration tests against live services, see ci-environment.yml

env:
  # Docker settings
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  
  # Docker registry for caching
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
  # Test settings
  VERBOSE: false
  NODE_VERSION: 18

jobs:
  cli-workflow-tests:
    name: CLI Workflow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host
            
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-tests-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-tests-
            ${{ runner.os }}-buildx-
            
      - name: Pre-pull base images
        run: |
          echo "Pre-pulling base images for tests..."
          docker pull node:18-alpine &
          docker pull alpine:latest &
          wait
          echo "Base images pre-pulled"
        
      - name: Build CLI test image with cache
        run: |
          cd projects
          
          # Build CLI test image with caching (same as environment setup workflow)
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -f openfn-workflows/Dockerfile.cli \
            --build-arg OPENFN_CLI_TEST_IMAGE=node:18-alpine \
            -t openfn-cli-test \
            .
          
          echo "CLI test image built successfully"
          docker images | grep openfn-cli-test
          
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true
          
      - name: Run CLI workflow tests using testing framework
        run: |
          echo "🧪 Running CLI workflow tests using indicator_workflow_testing framework"
          echo "ℹ️  This uses the proven testing framework from projects/indicator_workflow_testing"
          echo "ℹ️  Testing workflows from projects/openfn-workflows using CLI package only"
          echo ""
          
          # Change to the testing framework directory
          cd projects/indicator_workflow_testing
          
          # Run the existing CLI workflow tests
          ./run-tests.sh --cli-workflow
          
          echo ""
          echo "✅ CLI workflow tests completed successfully using testing framework"
          echo "ℹ️  For full integration tests against live services, see ci-environment.yml"
          
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [cli-workflow-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.cli-workflow-tests.result }}" == "success" ]; then
            echo "✅ All CLI workflow tests passed!"
            exit 0
          else
            echo "❌ CLI workflow tests failed or were skipped"
            echo "Result: ${{ needs.cli-workflow-tests.result }}"
            exit 1
          fi 