name: CI - Environment Setup

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'packages/**'
      - 'projects/**'
      - 'build-*.sh'
      - 'get-cli.sh'
      - 'mk.sh'
      - '.env.example'
      - '.github/workflows/ci-environment.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'packages/**'
      - 'projects/**'
      - 'build-*.sh'
      - 'get-cli.sh'
      - 'mk.sh'
      - '.env.example'
      - '.github/workflows/ci-environment.yml'
  workflow_dispatch:

env:
  # Docker settings
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  
  # Docker registry for caching
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
  # instant CLI settings
  INSTANT_VERSION: v2
  
  # Service versions
  OPENFN_VERSION: v2.13.3
  DHIS2_VERSION: 2.40.2.1
  POSTGRES_VERSION: 15-alpine
  
  # Dev mode settings
  MODE: dev
  CLUSTERED_MODE: false

jobs:
  environment-setup:
    name: Environment Setup and Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host
            
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
            
      - name: Pre-pull base images
        run: |
          echo "Pre-pulling commonly used base images..."
          docker pull postgres:15-alpine &
          docker pull catthehacker/ubuntu:act-latest &
          docker pull alpine:latest &
          docker pull node:18-alpine &
          wait
          echo "Base images pre-pulled"
        
      - name: Setup environment variables
        run: |
          cp .env.example .env
          
          # Override for CI environment
          echo "INSECURE=true" >> .env
          echo "MODE=dev" >> .env
          echo "CLUSTERED_MODE=false" >> .env
          echo "OPENFN_LOAD_WORKFLOWS_ON_STARTUP=true" >> .env
          echo "OPENFN_WORKFLOW_MANUAL_CLI=false" >> .env
          
          # Expose ports for dev mode
          echo "OPENFN_PORT=4000" >> .env
          echo "DHIS2_PORT=8080" >> .env
          echo "SFTP_PORT=2225" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          
          # Set CI-specific credentials
          echo "OPENFN_ADMIN_USER=root@openhim.org" >> .env
          echo "OPENFN_ADMIN_PASSWORD=instant101" >> .env
          echo "DHIS2_ADMIN_PASSWORD=district" >> .env
          
      - name: Download instant CLI
        run: |
          ./get-cli.sh linux
          chmod +x ./instant
          ./instant version
          
      - name: Initialize Docker Swarm
        run: |
          docker swarm init
          docker network create openfn_public --driver overlay --attachable || true
          docker network create postgres_public --driver overlay --attachable || true
          docker network create dhis2_public --driver overlay --attachable || true
          docker network create reverse-proxy_public --driver overlay --attachable || true
          
      - name: Setup test data for SFTP
        run: |
          # Copy test Excel files to SFTP data directory for CI builds
          mkdir -p projects/sftp/data/excel-files
          cp .github/test-data/excel-files/* projects/sftp/data/excel-files/
          echo "✅ Test data copied to SFTP data directory"
          ls -la projects/sftp/data/excel-files/
          
      - name: Build custom images with cache
        run: |
          # Function to build with cache
          build_with_cache() {
            local project_name="$1"
            local package_name="$2"
            
            echo "🔨 Building $project_name with caching..."
            
            # Skip openfn-workflows as it's used for CLI testing only
            if [[ "$project_name" == "openfn-workflows" ]]; then
              echo "⏭️  Skipping openfn-workflows - used for CLI testing only"
              return 0
            fi
            
            # Special handling for openfn-cli-test
            if [[ "$project_name" == "openfn-cli-test" ]]; then
              cd projects
              docker buildx build \
                --cache-from type=local,src=/tmp/.buildx-cache \
                --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                --load \
                -f openfn-workflows/Dockerfile.cli \
                --build-arg OPENFN_CLI_TEST_IMAGE=node:18-alpine \
                -t openfn-cli-test \
                .
              cd ..
              return 0
            fi
            
            # Get project directory
            if [[ ! -d "projects/$project_name" ]]; then
              echo "❌ Project directory not found: projects/$project_name"
              return 1
            fi
            
            # Determine Dockerfile location
            local dockerfile_arg=""
            if [[ -f "projects/$project_name/Dockerfile" ]]; then
              dockerfile_arg="-f projects/$project_name/Dockerfile"
            elif [[ -f "projects/$project_name/docker/Dockerfile" ]]; then
              dockerfile_arg="-f projects/$project_name/docker/Dockerfile"
            else
              echo "❌ No Dockerfile found for $project_name"
              return 1
            fi
            
            # Build based on project type
            case "$project_name" in
              "dhis2")
                docker buildx build \
                  --cache-from type=local,src=/tmp/.buildx-cache \
                  --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                  --load \
                  $dockerfile_arg \
                  --build-arg DHIS2_BASE_IMAGE=dhis2/core:2.40.2.1 \
                  -t dhis2-custom:latest \
                  projects/dhis2
                ;;
              "sftp")
                docker buildx build \
                  --cache-from type=local,src=/tmp/.buildx-cache \
                  --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                  --load \
                  $dockerfile_arg \
                  --build-arg SFTP_BASE_IMAGE=atmoz/sftp:latest \
                  -t sftp-with-data:latest \
                  projects/sftp
                ;;
              "openfn")
                cd projects
                docker buildx build \
                  --cache-from type=local,src=/tmp/.buildx-cache \
                  --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                  --load \
                  -f openfn/Dockerfile \
                  --build-arg OPENFN_BASE_IMAGE=openfn/lightning:v2.12.1 \
                  -t openfn-custom:latest \
                  .
                cd ..
                ;;
            esac
          }
          
          # Build each custom image with caching
          build_with_cache "openfn" "openfn"
          build_with_cache "dhis2" "dhis2-instance"
          build_with_cache "sftp" "sftp-storage"
          build_with_cache "openfn-cli-test" "openfn"
          
          # Verify images were built
          docker images | grep -E "(openfn-custom|openfn-cli-test|dhis2|sftp-with-data)"
          
      - name: Build platform image with cache
        run: |
          # Build platform image with caching
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -t malawi-dhis2-indicators:latest \
            .
          
          docker images | grep malawi-dhis2
          
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true
          
      - name: Deploy PostgreSQL
        run: |
          ./instant package init -n database-postgres --env-file=.env -d
          
          # Wait for PostgreSQL to be ready
          echo "Waiting for PostgreSQL..."
          timeout 120s bash -c 'until docker service ls | grep -q "postgres_postgres-1.*1/1"; do sleep 5; done'
          sleep 10
          
      - name: Deploy SFTP Storage
        run: |
          ./instant package init -n sftp-storage --env-file=.env -d
          
          # Wait for SFTP to be ready
          echo "Waiting for SFTP server..."
          timeout 60s bash -c 'until docker service ls | grep -q "sftp-storage_sftp-server.*1/1"; do sleep 5; done'
          
      - name: Deploy DHIS2
        run: |
          ./instant package init -n dhis2-instance --env-file=.env -d
          
          # Wait for DHIS2 to be ready (this takes longer)
          echo "Waiting for DHIS2..."
          timeout 300s bash -c 'until docker service ls | grep -q "dhis2-instance_dhis2.*1/1"; do sleep 10; done'
          
      - name: Deploy OpenFN
        run: |
          ./instant package init -n openfn --env-file=.env -d
          
          # Wait for OpenFN to be ready
          echo "Waiting for OpenFN..."
          timeout 120s bash -c 'until docker service ls | grep -q "openfn_openfn.*1/1"; do sleep 5; done'
          timeout 120s bash -c 'until docker service ls | grep -q "openfn_worker.*1/1"; do sleep 5; done'
          
      - name: Service Health Checks
        run: |
          # Function to check service health
          check_service() {
            local name=$1
            local url=$2
            local expected=$3
            local max_attempts=30
            local attempt=0
            
            echo "Checking $name at $url..."
            while [ $attempt -lt $max_attempts ]; do
              if curl -s -f -m 10 "$url" | grep -q "$expected" 2>/dev/null || \
                 curl -s -f -m 10 -o /dev/null "$url" 2>/dev/null; then
                echo "✅ $name is healthy"
                return 0
              fi
              attempt=$((attempt + 1))
              echo "  Attempt $attempt/$max_attempts failed, retrying..."
              sleep 5
            done
            
            echo "❌ $name health check failed after $max_attempts attempts"
            return 1
          }
          
          # Check PostgreSQL
          docker run --rm --network postgres_public postgres:15-alpine \
            pg_isready -h postgres-1 -p 5432 -U postgres
          
          # Check SFTP
          docker run --rm --network host alpine/curl:latest sh -c "
            apk add --no-cache openssh-client >/dev/null 2>&1 && \
            timeout 10 ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 -p 2225 openfn@localhost exit 0 2>&1 | grep -q 'password' && \
            echo '✅ SFTP is accepting connections'"
          
          # Check DHIS2
          check_service "DHIS2" "http://localhost:8080/dhis-web-commons/security/login.action" "login"
          
          # Check OpenFN
          check_service "OpenFN" "http://localhost:4000/health_check" "ok"
          
      - name: Run workflow integration tests
        run: |
          echo "🧪 Running OpenFN workflow integration tests against live services..."
          
          # Test 1: SFTP Connection Test
          echo "=== Testing SFTP connectivity ==="
          docker run --rm --network host \
            -v "$(pwd)/projects/indicator_workflow_testing:/app/tests:ro" \
            openfn-cli-test \
            sh -c "
              echo 'Testing SFTP connection to localhost:2225...'
              apk add --no-cache openssh-client >/dev/null 2>&1
              echo 'openfn123' | timeout 10 sftp -P 2225 -o StrictHostKeyChecking=no openfn@localhost << 'EOF'
              ls
              cd data/excel-files
              ls *.xlsx
              quit
          EOF
            "
          
          # Test 2: OpenFN CLI workflow validation
          echo -e "\n=== Testing OpenFN CLI against workflows ==="
          docker run --rm --network host \
            -v "$(pwd)/projects/openfn-workflows:/app/workflows:ro" \
            openfn-cli-test \
            sh -c "
              echo 'Validating workflow structure...'
              find /app/workflows -name '*.js' -o -name '*.json' -o -name '*.yaml' | head -10
              echo 'Testing OpenFN CLI functionality...'
              openfn --version
              ls -la /app/workflows/sftp-dhis2/
            "
          
          # Test 3: Service connectivity from CLI container
          echo -e "\n=== Testing service connectivity from CLI container ==="
          docker run --rm --network host \
            openfn-cli-test \
            sh -c "
              echo 'Testing DHIS2 connectivity...'
              wget -q --spider http://localhost:8080/dhis-web-commons/security/login.action && echo '✅ DHIS2 reachable' || echo '❌ DHIS2 not reachable'
              echo 'Testing OpenFN Lightning connectivity...'
              wget -q --spider http://localhost:4000/health_check && echo '✅ OpenFN reachable' || echo '❌ OpenFN not reachable'
              echo 'Testing PostgreSQL connectivity...'
              nc -z localhost 5432 && echo '✅ PostgreSQL reachable' || echo '❌ PostgreSQL not reachable'
              echo 'Testing SFTP connectivity...'
              nc -z localhost 2225 && echo '✅ SFTP reachable' || echo '❌ SFTP not reachable'
            "
          
          echo "✅ All workflow integration tests completed successfully"
          
      - name: List running services
        if: always()
        run: |
          echo "=== Docker Services ==="
          docker service ls
          
          echo -e "\n=== Service Details ==="
          docker service ps postgres_postgres-1 --no-trunc || true
          docker service ps sftp-storage_sftp-server --no-trunc || true
          docker service ps dhis2-instance_dhis2 --no-trunc || true
          docker service ps openfn_openfn --no-trunc || true
          docker service ps openfn_worker --no-trunc || true
          
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== PostgreSQL Logs ==="
          docker service logs postgres_postgres-1 --tail 50 || true
          
          echo -e "\n=== SFTP Logs ==="
          docker service logs sftp-storage_sftp-server --tail 50 || true
          
          echo -e "\n=== DHIS2 Logs ==="
          docker service logs dhis2-instance_dhis2 --tail 50 || true
          
          echo -e "\n=== OpenFN Logs ==="
          docker service logs openfn_openfn --tail 50 || true
          docker service logs openfn_worker --tail 50 || true 