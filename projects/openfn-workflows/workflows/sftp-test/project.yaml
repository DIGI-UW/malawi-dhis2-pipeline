name: sftp-test-uri-fixed
description: SFTP test project with runtime URI fix for host credentials

# Single source of truth for workflow configuration  
# This file is used by both CLI testing and OpenFN platform deployment
# Note: Uses custom @pmanko/sftp-fixed@2.0.14-dev-20250709-155001 via LOCAL_ADAPTORS mode

credentials:
  sftp-test-credential:
    name: "sftp-test-credential"
    owner: "root@openhim.org"

workflows:
  sftp-test-workflow:
    name: SFTP Test Workflow (Custom Adaptor)
    
    jobs:
      ListFiles:
        name: List SFTP Files
        adaptor: '@openfn/language-sftp@2.0.17-custom'
        enabled: true
        credential: sftp-test-credential  # References the credential defined above
        body:
          path: ./jobs/list-files.js
    
    triggers:
      manual:
        type: webhook
        enabled: true
      
      test-cron:
        type: cron
        cron_expression: "*/2 * * * *"  # Every 2 minutes for testing
        enabled: true  # Enabled for testing
    
    edges:
      - source_trigger: manual
        target_job: ListFiles
        condition_type: always
        enabled: true
      
      - source_trigger: test-cron
        target_job: ListFiles
        condition_type: always
        enabled: true  # Enabled for testing