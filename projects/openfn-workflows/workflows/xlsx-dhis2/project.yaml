name: excel-sheet-dhis2
description: Simplified Excel Sheet to DHIS2 Large File Processing Pipeline
collections: null
credentials:
  sftp-credential:
    name: "sftp-test-credential"
    owner: "root@openhim.org"
  dhis2-credential:
    name: "dhis2-credential"
    owner: "root@openhim.org"
workflows:
  ExcelSheetToDHIS2Workflow:
    name: Excel Sheet to DHIS2 Workflow
    jobs:
      "1-check-for-new-files":
        name: "1. Check SFTP for New Excel Files"
        adaptor: "@openfn/language-sftp@2.0.14-custom-enhanced"
        credential: "sftp-credential"
        body:
          path: "./jobs/1-check-for-new-files.js"
      "2-process-file-chunks":
        name: "2. Process Excel File in Chunks"
        adaptor: "@openfn/language-sftp@2.0.14-custom-enhanced"
        credential: "sftp-credential"
        body:
          path: "./jobs/2-process-file-chunks.js"
      "3-consolidate-results":
        name: "3. Consolidate Processing Results"
        adaptor: "@openfn/language-dhis2@6.3.4"
        credential: "dhis2-credential"
        body:
          path: "./jobs/3-consolidate-results.js"
      "4-update-file-tracking":
        name: "4. Update File Tracking State"
        adaptor: "@openfn/language-common@2.4.0"
        credential: null
        body:
          path: "./jobs/4-update-file-tracking.js"
          
    triggers:
      cron-file-check:
        type: cron
        cron_expression: "*/5 * * * *"
        job: "1-check-for-new-files"
        enabled: true
      manual-excel-processing:
        type: webhook
        job: "2-process-file-chunks"
        enabled: true
        
    edges:
      # Main workflow execution path
      checkToProcess:
        source_job: "1-check-for-new-files"
        target_job: "2-process-file-chunks"
        condition_type: "on_job_success"
        condition_expression: "state.newFilesFound === true"
        enabled: true
      processToConsolidate:
        source_job: "2-process-file-chunks"
        target_job: "3-consolidate-results"
        condition_type: "on_job_success"
        enabled: true
      consolidateToUpdate:
        source_job: "3-consolidate-results"
        target_job: "4-update-file-tracking"
        condition_type: "on_job_success"
        enabled: true 