name: excel-sheet-dhis2
description: A simplified workflow for processing large Excel files and uploading to DHIS2.
credentials:
  sftp-credential:
    name: "sftp-test-credential"
    owner: "root@openhim.org"
  dhis2-credential:
    name: "dhis2-credential"
    owner: "root@openhim.org"
workflows:
  ExcelSheetToDHIS2Workflow:
    name: Excel Sheet to DHIS2 Workflow
    jobs:
      "1-check-sftp-files":
        name: "1. Check SFTP for New Files"
        adaptor: '@openfn/language-sftp@2.0.14-custom-enhanced'
        credential: sftp-credential
        body:
          path: ./jobs/check-sftp-files.js
      "2-download-and-chunk":
        name: "2. Download and Chunk Excel File"
        adaptor: '@openfn/language-sftp@2.0.14-custom-enhanced'
        credential: sftp-credential
        body:
          path: ./jobs/download-and-chunk-excel.js
      "3-process-chunks":
        name: "3. Process Excel Chunks"
        adaptor: '@openfn/language-sftp@2.0.14-custom-enhanced'
        credential: sftp-credential
        body:
          path: ./jobs/process-excel-chunk.js
      "4-generate-batch":
        name: "4. Generate DHIS2 Batch"
        adaptor: '@openfn/language-common@2.4.0'
        credential: null
        body:
          path: ./jobs/generate-dhis2-batch.js
      "5-upload-batch":
        name: "5. Upload DHIS2 Batch"
        adaptor: '@openfn/language-dhis2@6.3.4'
        credential: dhis2-credential
        body:
          path: ./jobs/upload-dhis2-batch.js
      "6-consolidate-results":
        name: "6. Consolidate Results"
        adaptor: '@openfn/language-common@2.4.0'
        credential: null
        body:
          path: ./jobs/consolidate-results.js
          
    triggers:
      cron-file-check:
        type: cron
        cron_expression: "*/5 * * * *"
        enabled: true
        
    edges:
      cronToCheck:
        source_trigger: "cron-file-check"
        target_job: "1-check-sftp-files"
        condition_type: "always"
        enabled: true
      checkToDownload:
        source_job: "1-check-sftp-files"
        target_job: "2-download-and-chunk"
        condition_type: "on_job_success"
        condition_expression: "state.newFilesFound === true"
        enabled: true
      downloadToProcess:
        source_job: "2-download-and-chunk"
        target_job: "3-process-chunks"
        condition_type: "on_job_success"
        enabled: true
      processToGenerate:
        source_job: "3-process-chunks"
        target_job: "4-generate-batch"
        condition_type: "on_job_success"
        enabled: true
      generateToUpload:
        source_job: "4-generate-batch"
        target_job: "5-upload-batch"
        condition_type: "on_job_success"
        enabled: true
      uploadToConsolidate:
        source_job: "5-upload-batch"
        target_job: "6-consolidate-results"
        condition_type: "on_job_success"
        enabled: true 