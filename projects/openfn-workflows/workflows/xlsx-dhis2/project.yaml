name: excel-sheet-dhis2
description: Excel Sheet to DHIS2 Large File Processing Pipeline with Chunked Architecture
collections: null
credentials:
  sftp-credential:
    name: "sftp-test-credential"
    owner: "root@openhim.org"
  dhis2-credential:
    name: "dhis2-credential"
    owner: "root@openhim.org"
workflows:
  ExcelSheetToDHIS2Workflow:
    name: Excel Sheet to DHIS2 Workflow
    jobs:
      CheckSFTPFiles:
        name: Check SFTP for New or Updated Files
        adaptor: '@openfn/language-sftp@2.0.14-custom-enhanced'
        credential: sftp-credential
        body:
          path: ./jobs/check-sftp-files.js
      DownloadAndChunkExcel:
        name: Download and Chunk Excel File
        adaptor: '@openfn/language-sftp@2.0.14-custom-enhanced'
        credential: sftp-credential
        body:
          path: ./jobs/download-and-chunk-excel.js
      ProcessExcelChunk:
        name: Process Excel Chunk
        adaptor: '@openfn/language-common@2.4.0'
        credential: null
        body:
          path: ./jobs/process-excel-chunk.js
      GenerateDHIS2Batch:
        name: Generate DHIS2 Batch Payload
        adaptor: '@openfn/language-common@2.4.0'
        credential: null
        body:
          path: ./jobs/generate-dhis2-batch.js
      UploadDHIS2Batch:
        name: Upload DHIS2 Batch
        adaptor: '@openfn/language-dhis2@6.3.4'
        credential: dhis2-credential
        body:
          path: ./jobs/upload-dhis2-batch.js
      ConsolidateResults:
        name: Consolidate Processing Results
        adaptor: '@openfn/language-common@2.4.0'
        credential: null
        body:
          path: ./jobs/consolidate-results.js
      TrackChunkState:
        name: Track Chunk State and Monitor Data Integrity
        adaptor: '@openfn/language-common@2.4.0'
        credential: null
        body:
          path: ./jobs/track-chunk-state.js
      RetryFailedChunks:
        name: Retry Failed Chunks
        adaptor: '@openfn/language-common@2.4.0'
        credential: null
        body:
          path: ./jobs/retry-failed-chunks.js
      MonitoringDashboard:
        name: Monitoring Dashboard
        adaptor: '@openfn/language-common@2.4.0'
        credential: null
        body:
          path: ./jobs/monitoring-dashboard.js
      UpdateFileTracking:
        name: Update File Tracking State
        adaptor: '@openfn/language-common@2.4.0'
        credential: null
        body:
          path: ./jobs/update-file-tracking.js
          
    triggers:
      # Cron trigger - runs every 5 minutes for file monitoring
      cron-file-check:
        type: cron
        cron_expression: "*/5 * * * *"
        enabled: true
      # Manual trigger for testing
      manual-excel-processing:
        type: webhook
        enabled: true
        
    edges:
      # Cron-triggered workflow
      cronFileCheckToCheckSFTPFiles:
        source_trigger: cron-file-check
        target_job: CheckSFTPFiles
        condition_type: always
        enabled: true
      # Manual trigger for testing
      manualTriggerToDownloadAndChunk:
        source_trigger: manual-excel-processing
        target_job: DownloadAndChunkExcel
        condition_type: always
        enabled: true
      # Job flow after file check
      CheckSFTPFilesToDownloadAndChunk:
        source_job: CheckSFTPFiles
        target_job: DownloadAndChunkExcel
        condition_type: on_job_success
        condition_expression: "state.newFilesFound === true"
        enabled: true
      # Job flow after download and chunking
      DownloadAndChunkToProcessChunk:
        source_job: DownloadAndChunkExcel
        target_job: ProcessExcelChunk
        condition_type: on_job_success
        enabled: true
      # Job flow after chunk processing
      ProcessChunkToGenerateBatch:
        source_job: ProcessExcelChunk
        target_job: GenerateDHIS2Batch
        condition_type: on_job_success
        enabled: true
      # Job flow to DHIS2 upload
      GenerateBatchToUploadBatch:
        source_job: GenerateDHIS2Batch
        target_job: UploadDHIS2Batch
        condition_type: on_job_success
        enabled: true
      # Job flow after upload
      UploadBatchToConsolidateResults:
        source_job: UploadDHIS2Batch
        target_job: ConsolidateResults
        condition_type: on_job_success
        enabled: true
      # Update tracking after consolidation
      ConsolidateResultsToUpdateFileTracking:
        source_job: ConsolidateResults
        target_job: UpdateFileTracking
        condition_type: on_job_success
        enabled: true
      # Monitoring jobs (can be triggered from various points)
      UploadBatchToTrackChunkState:
        source_job: UploadDHIS2Batch
        target_job: TrackChunkState
        condition_type: on_job_success
        enabled: true
      # Retry logic
      TrackChunkStateToRetryFailedChunks:
        source_job: TrackChunkState
        target_job: RetryFailedChunks
        condition_type: on_job_success
        condition_expression: "state.failedChunks && state.failedChunks.length > 0"
        enabled: true
      # Dashboard monitoring
      ConsolidateResultsToMonitoringDashboard:
        source_job: ConsolidateResults
        target_job: MonitoringDashboard
        condition_type: on_job_success
        enabled: true 