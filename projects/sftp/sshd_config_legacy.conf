# OpenFN SFTP Adaptor Compatibility - Legacy SSH Algorithm Support

# Enable legacy key exchange algorithms (required for older Node.js SSH libraries)
KexAlgorithms diffie-hellman-group14-sha1,diffie-hellman-group1-sha1,curve25519-sha256,diffie-hellman-group14-sha256

# Enable legacy ciphers (required for OpenFN SFTP adaptor)
Ciphers aes128-ctr,aes192-ctr,aes256-ctr,aes128-cbc,aes192-cbc,aes256-cbc,chacha20-poly1305@openssh.com

# Enable legacy MAC algorithms
MACs hmac-sha1,hmac-sha2-256,hmac-sha2-512,umac-64@openssh.com,umac-128@openssh.com

# Generate and use RSA host key (required for older clients)
HostKeyAlgorithms ssh-rsa,ssh-ed25519

# Allow legacy public key types
PubkeyAcceptedKeyTypes ssh-rsa,ssh-ed25519 