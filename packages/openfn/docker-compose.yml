services:
  openfn:
    image: ${LOCAL_OPENFN_IMAGE:-$OPENFN_IMAGE}
    # This command runs a shell script that performs the following actions:
    # 1. Executes the Lightning.Release.migrate() function to handle database migrations.
    # 2. Starts the Lightning application using the /app/bin/lightning start command.
    command: >
      sh -lc '
        export_from_secret() { var="$1"; path="$2"; [ -f "$path" ] && export "$var"="$(cat "$path")" || true; };
        export_from_secret SECRET_KEY_BASE /run/secrets/openfn_secret_key_base;
        export_from_secret PRIMARY_ENCRYPTION_KEY /run/secrets/openfn_primary_encryption_key;
        export_from_secret WORKER_RUNS_PRIVATE_KEY /run/secrets/openfn_worker_runs_private_key;
        export_from_secret WORKER_SECRET /run/secrets/openfn_worker_secret;
        export_from_secret OPENFN_API_KEY /run/secrets/openfn_api_key;
        export_from_secret OPENFN_ADMIN_PASSWORD /run/secrets/openfn_admin_password;
        export_from_secret DATABASE_URL /run/secrets/openfn_database_url;
        export_from_secret DHIS2_ADMIN_PASSWORD /run/secrets/dhis2_admin_password;
        export_from_secret DHIS2_PASSWORD /run/secrets/dhis2_password;
        /app/bin/lightning eval "Lightning.Release.migrate()" && /app/bin/lightning start'
    deploy:
      resources:
        limits:
          cpus: '${OPENFN_DOCKER_WEB_CPUS:-0}'
          memory: '${OPENFN_DOCKER_WEB_MEMORY:-0}'
    environment:
      - DATABASE_URL=postgresql://${OPENFN_POSTGRESQL_USERNAME}:${OPENFN_POSTGRESQL_PASSWORD}@${POSTGRES_SERVICE}:${POSTGRES_PORT}/${OPENFN_POSTGRESQL_DB}
      - DISABLE_DB_SSL=${OPENFN_DISABLE_DB_SSL}
      - IS_RESETTABLE_DEMO=${OPENFN_IS_RESETTABLE_DEMO}
      - LISTEN_ADDRESS=${OPENFN_LISTEN_ADDRESS}
      - LOG_LEVEL=${OPENFN_LOG_LEVEL}
      - ORIGINS=${OPENFN_ORIGINS}
      - PRIMARY_ENCRYPTION_KEY=${OPENFN_PRIMARY_ENCRYPTION_KEY}
      - SECRET_KEY_BASE=${OPENFN_SECRET_KEY_BASE}
      - WORKER_RUNS_PRIVATE_KEY=${OPENFN_WORKER_RUNS_PRIVATE_KEY}
      - WORKER_SECRET=${OPENFN_WORKER_SECRET}
      - OPENFN_API_KEY=${OPENFN_API_KEY}
      - OPENFN_ADMIN_PASSWORD=${OPENFN_ADMIN_PASSWORD}
      - OPENFN_ADMIN_USER=${OPENFN_ADMIN_USER}
      - WORKER_MAX_RUN_MEMORY_MB=${WORKER_MAX_RUN_MEMORY_MB}
      - WORKER_MAX_RUN_DURATION_SECONDS=${WORKER_MAX_RUN_DURATION_SECONDS}
      - KAFKA_TRIGGERS_ENABLED=${OPENFN_KAFKA_TRIGGERS_ENABLED}
      - LOCAL_ADAPTORS=${LOCAL_ADAPTORS}
      - OPENFN_ADAPTORS_REPO=${OPENFN_ADAPTORS_REPO}
    secrets:
      - openfn_secret_key_base
      - openfn_primary_encryption_key
      - openfn_worker_runs_private_key
      - openfn_worker_secret
      - openfn_api_key
      - openfn_admin_password
      - openfn_database_url
      - dhis2_admin_password
      - dhis2_password
    healthcheck:
      test: '${DOCKER_WEB_HEALTHCHECK_TEST:-curl localhost:4000/health_check}'
      interval: '10s'
      timeout: '3s'
      start_period: '5s'
      retries: 3
    networks:
      - kafka_public
      - postgres
      - openfn_public
      - reverse_proxy_public
      - dhis2_public
  worker:
    image: ${LOCAL_OPENFN_WORKER_IMAGE:-$OPENFN_WORKER_IMAGE}
    deploy:
      resources:
        limits:
          cpus: '${OPENFN_DOCKER_WORKER_CPUS:-0}'
          memory: '${OPENFN_DOCKER_WORKER_MEMORY:-0}'
    environment:
      - WORKER_LIGHTNING_PUBLIC_KEY=${OPENFN_WORKER_LIGHTNING_PUBLIC_KEY}
      - WORKER_SECRET=${OPENFN_WORKER_SECRET}
      - WORKER_MAX_RUN_MEMORY_MB=${WORKER_MAX_RUN_MEMORY_MB}
      - WORKER_MAX_RUN_DURATION_SECONDS=${WORKER_MAX_RUN_DURATION_SECONDS}
      - NODE_ENV=production
      - LOCAL_ADAPTORS=${LOCAL_ADAPTORS}
      - OPENFN_ADAPTORS_REPO=${OPENFN_ADAPTORS_REPO}
    command: >
      sh -lc '
        export_from_secret() { var="$1"; path="$2"; [ -f "$path" ] && export "$var"="$(cat "$path")" || true; };
        export_from_secret WORKER_SECRET /run/secrets/openfn_worker_secret;
        export_from_secret WORKER_RUNS_PRIVATE_KEY /run/secrets/openfn_worker_runs_private_key;
        pnpm -C packages/ws-worker start:prod -l ws://openfn:${URL_PORT-4000}/worker'
    secrets:
      - openfn_worker_secret
      - openfn_worker_runs_private_key
    networks:
      - kafka_public
      - openfn_public
      - postgres
      - dhis2_public

networks:
  openfn_public:
    name: openfn_public
    external: true
  kafka_public:
    name: kafka_public
    external: true
  postgres:
    name: postgres_public
    external: true
  reverse_proxy_public:
    name: reverse-proxy_public
    external: true
  dhis2_public:
    name: dhis2_public
    external: true
  

secrets:
  openfn_secret_key_base:
    external: true
  openfn_primary_encryption_key:
    external: true
  openfn_worker_runs_private_key:
    external: true
  openfn_worker_secret:
    external: true
  openfn_api_key:
    external: true
  openfn_admin_password:
    external: true
  openfn_database_url:
    external: true
  dhis2_admin_password:
    external: true
  dhis2_password:
    external: true

