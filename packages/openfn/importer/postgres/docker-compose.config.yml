
services:
  openfn_db_config:
    image: node:erbium-alpine
    command: sh -lc '
      export_from_secret() { var="$1"; path="$2"; [ -f "$path" ] && export "$var"="$(cat "$path")" || true; };
      export_from_secret POSTGRES_PASSWORD /run/secrets/postgres_password;
      export_from_secret NEW_DATABASE_PASSWORD /run/secrets/openfn_db_user_password;
      cd /importer && ls && npm i && ls && node create-db.js'
    configs:
      - target: /importer/package.json
        source: package.json
      - target: /importer/create-db.js
        source: create-db.js
    networks:
      postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_SERVICE: ${POSTGRES_SERVICE}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      NEW_DATABASE_NAME: ${OPENFN_POSTGRESQL_DB}
      NEW_DATABASE_USER: ${OPENFN_POSTGRESQL_USERNAME}
      NEW_DATABASE_PASSWORD: ${OPENFN_POSTGRESQL_PASSWORD}
    deploy:
      replicas: 1
      restart_policy:
        condition: none

    secrets:
      - postgres_password
      - openfn_db_user_password

networks:
  postgres:
    name: postgres_public
    external: true

configs:
  package.json:
    file: ./package.json
    name: package.json-${package_json_DIGEST:?err}
    labels:
      name: openfn
  create-db.js:
    file: ./create-db.js
    name: create_db.js
    labels:
      name: openfn
secrets:
  postgres_password:
    external: true
  openfn_db_user_password:
    external: true

