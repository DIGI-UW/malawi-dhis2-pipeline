server {
    listen          80;
    server_name     sftp.mwdhis2.info;

    location /.well-known/acme-challenge/ {
        resolver    127.0.0.11 valid=30s;
        set         $upstream_certbot certbot;
        proxy_pass  http://$upstream_certbot$request_uri;
    }

    location / {
        return      301 https://$host$request_uri;
    }
}

server {
    listen          443 ssl http2;
    listen          [::]:443 ssl http2;
    server_name     sftp.mwdhis2.info;

    # Increase client max body size for file uploads
    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        resolver    127.0.0.11 valid=30s;
        set         $upstream_certbot certbot;
        proxy_pass  http://$upstream_certbot$request_uri;
    }

    # API endpoints with stricter rate limiting for uploads
    location ~* ^/api/upload {
        limit_req zone=auth burst=5 nodelay;
        resolver    127.0.0.11 valid=30s;
        set         $upstream_sftp sftp-storage;
        proxy_pass  http://$upstream_sftp:80;
        
        # Upload specific timeouts
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }

    # Download endpoints
    location ~* ^/api/download {
        limit_req zone=general burst=10 nodelay;
        resolver    127.0.0.11 valid=30s;
        set         $upstream_sftp sftp-storage;
        proxy_pass  http://$upstream_sftp:80;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        resolver    127.0.0.11 valid=30s;
        set         $upstream_sftp sftp-storage;
        proxy_pass  http://$upstream_sftp:80;
        
        # SFTP management UI specific headers
        proxy_set_header X-Forwarded-Server $host;
        proxy_redirect off;
        
        # Security headers for file management
        add_header X-Content-Type-Options nosniff always;
        add_header X-Download-Options noopen always;
    }
}