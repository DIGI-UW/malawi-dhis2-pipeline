server {
    listen          80;
    server_name     dhis2.mwdhis2.info;

    location /.well-known/acme-challenge/ {
        resolver    127.0.0.11 valid=30s;
        set         $upstream_certbot certbot;
        proxy_pass  http://$upstream_certbot$request_uri;
    }

    location / {
        return      301 https://$host$request_uri;
    }
}

server {
    listen          443 ssl http2;
    listen          [::]:443 ssl http2;
    server_name     dhis2.mwdhis2.info;

    # Rate limiting for authentication endpoints
    location ~* ^/api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        resolver    127.0.0.11 valid=30s;
        set         $upstream_dhis2 dhis2;
        proxy_pass  http://$upstream_dhis2:8080;
    }

    location /.well-known/acme-challenge/ {
        resolver    127.0.0.11 valid=30s;
        set         $upstream_certbot certbot;
        proxy_pass  http://$upstream_certbot$request_uri;
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        resolver    127.0.0.11 valid=30s;
        set         $upstream_dhis2 dhis2;
        proxy_pass  http://$upstream_dhis2:8080;
        
        # DHIS2 specific headers
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_redirect off;
        
        # Increase timeouts for DHIS2 analytics
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }
}
