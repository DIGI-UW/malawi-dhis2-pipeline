user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 1024;
}

# Platform Reverse Proxy
http {
    server_names_hash_bucket_size 128;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_proxied any;
    gzip_types 
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/fhir+json;
    gzip_vary on;
    gzip_min_length 1000;

    # SSL Configuration
    ssl_certificate /run/secrets/fullchain.pem;
    ssl_certificate_key /run/secrets/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;

    # Proxy Configuration
    proxy_headers_hash_max_size 512;
    proxy_headers_hash_bucket_size 128;
    proxy_set_header    Host                $host;
    proxy_set_header    X-Forwarded-Host    $host;
    proxy_set_header    X-Forwarded-For     $remote_addr;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto   $scheme;

    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Prevent serving nginx version on error pages
    server_tokens off;

    # Default server for unknown hosts
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }

    # HTTP to HTTPS redirect for main domain
    server {
        listen 80;
        server_name domain_name *.domain_name;

        location /.well-known/acme-challenge/ {
            resolver 127.0.0.11 valid=30s;
            set $upstream_certbot certbot;
            proxy_pass http://$upstream_certbot$request_uri;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main domain HTTPS (landing page or redirect)
    server {
        listen 443 ssl http2;
        server_name domain_name;

        location /.well-known/acme-challenge/ {
            resolver 127.0.0.11 valid=30s;
            set $upstream_certbot certbot;
            proxy_pass https://$upstream_certbot$request_uri;
        }

        location / {
            # Redirect to DHIS2 as default
            return 301 https://dhis2.domain_name$request_uri;
        }
    }

    include /etc/nginx/conf.d/http-*.conf;
    include /etc/nginx/conf.d/package-conf-secure/http-*.conf;
}

stream {
    include /etc/nginx/conf.d/stream-*.conf;
}
